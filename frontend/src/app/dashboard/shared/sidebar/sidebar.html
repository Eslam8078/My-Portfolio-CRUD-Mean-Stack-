<aside class="sidebar">

  <!-- Brand -->
  <div class="sidebar-brand">
    <span class="brand-accent">E</span>slam
    <span class="sidebar-brand-tag">Admin</span>
  </div>


  <!-- Navigation -->
  <nav class="sidebar-nav">

    <a
      routerLink="home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>


    <a
      routerLink="about"
      routerLinkActive="active"
    >
      <span class="nav-icon">👤</span>
      <span>About</span>
    </a>


    <a
      routerLink="education"
      routerLinkActive="active"
    >
      <span class="nav-icon">🎓</span>
      <span>Education</span>
    </a>


    <a
      routerLink="skills"
      routerLinkActive="active"
    >
      <span class="nav-icon">⚡</span>
      <span>Skills</span>
    </a>


    <a
      routerLink="projects"
      routerLinkActive="active"
    >
      <span class="nav-icon">💼</span>
      <span>Projects</span>
    </a>


    <a
      routerLink="experience"
      routerLinkActive="active"
    >
      <span class="nav-icon">📊</span>
      <span>Experience</span>
    </a>


    <!-- Messages -->
    <a
      routerLink="messages"
      routerLinkActive="active"
      class="messages-link"
    >
      <span class="nav-icon">✉</span>

      <span class="messages-text">
        Messages
      </span>

      @if (unreadCount > 0) {
        <span class="message-badge">
          {{ unreadCount }}
        </span>
      }
    </a>

  </nav>


  <!-- Footer -->
  <div class="sidebar-footer">

    <a
      routerLink="/"
      class="sidebar-footer-link"
    >
      <span>←</span>
      Back to site
    </a>

  </div>

</aside>
