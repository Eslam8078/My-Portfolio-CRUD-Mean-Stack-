<section class="contact">
  <div class="contact-container">
    <h2>Contact Me</h2>
    <p class="contact-intro">Have a project, opportunity, or question? Send me a message and I will get back to you.</p>
    <div class="contact-details">
      <a href="mailto:eslamayman2412@gmail.com">eslamayman2412@gmail.com</a>
      <a href="tel:01068078245">01068078245</a>
      <span>Cairo, Egypt</span>
    </div>

    @if (successMessage) {
      <p class="success">{{ successMessage }}</p>
    }

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <form (ngSubmit)="sendMessage()">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="contact.name"
          required
          placeholder="Enter your name"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="contact.email"
          required
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input
          id="subject"
          type="text"
          name="subject"
          [(ngModel)]="contact.subject"
          required
          placeholder="Enter subject"
        />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          [(ngModel)]="contact.message"
          required
          rows="6"
          placeholder="Write your message..."
        ></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>
  </div>
</section>
